name: Build Remotion APK

# -----------------------------------------------------------------------------
# 完全自包含的 OpenMinis -> Debian(glibc) rootfs 构建流程。
# 关键改动：prepare 脚本与打补丁的 python 不再依赖仓库里的外部文件，
# 而是在 workflow 运行时用 heredoc 直接生成到 /tmp，避免“文件没放到根目录”之类问题。
# 你只需要把这个 .github/workflows/build-remotion-apk.yml 提交到仓库即可。
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # 关键：必须在原生 arm64 runner 上跑。
    # rootfs 那一步用 `docker run --platform linux/arm64` 装 Debian+Chromium+Node，
    # 若在 x86 的 ubuntu-latest 上跑会被 QEMU 软件模拟，慢 5~10 倍（一次构建 30+ 分钟）。
    # ubuntu-24.04-arm 是 GitHub 官方原生 arm64 镜像，自带 Docker/Gradle/Java/CMake/Node，
    # 容器原生执行，rootfs 构建从几十分钟降到几分钟。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout (含递归子模块)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 安装宿主机工具 (curl, unzip, gzip, pigz 等)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip xz-utils ca-certificates gzip pigz || \
          sudo apt-get install -y -qq curl unzip xz-utils ca-certificates gzip pigz

      # ===== 构建 Debian(glibc) rootfs（脚本在运行时生成，不依赖外部文件）=====
      - name: 构建 Debian(glibc) rootfs
        run: |
          cat > /tmp/prepare_debian_rootfs_android.sh <<'PREP_EOF'
          #!/bin/bash
          set -euxo pipefail
          trap 'echo "[ERROR] command failed at line $LINENO: $BASH_COMMAND" >&2' ERR

          SUITE="${1:-bookworm}"
          case "$SUITE" in
            bookworm) DOCKER_IMG="debian:bookworm" ;;
            bullseye) DOCKER_IMG="debian:bullseye" ;;
            *)        DOCKER_IMG="debian:$SUITE" ;;
          esac

          OUT_TARBALL="debian-minirootfs.tar.gz"
          OUT_DIR="$(pwd)"

          log() { echo "[debian-rootfs] $*" ; }
          err() { echo "[debian-rootfs] ERROR: $*" >&2 ; }

          echo "===== DEBUG: docker version ====="
          docker version 2>&1 | head -20 || true
          echo "===== DEBUG: binfmt_misc entries ====="
          ls -1 /proc/sys/fs/binfmt_misc/ 2>&1 | head -40 || true
          echo "===== DEBUG: uname ====="
          uname -m

          if ! command -v docker >/dev/null 2>&1; then
            err "Docker 不可用。GitHub ubuntu-latest 默认自带 docker。"
            exit 1
          fi

          # binfmt/qemu 仅用于【x86 宿主模拟 arm64 容器】。在原生 arm64 runner
          # (ubuntu-24.04-arm) 上 docker 直接原生跑 arm64 容器，根本不需要它；而且
          # tonistiigi/binfmt / multiarch/qemu-user-static 这两个镜像在受限网络下常拉取
          # 失败，原脚本会因此 exit 1、把整步在 ~1 分钟内干掉（这正是 run #27 的快速失败）。
          # 故：原生 arm64 直接跳过；非 arm64 才注册，且注册失败也只告警、不中断构建。
          HOST_ARCH="$(uname -m)"
          if [ "$HOST_ARCH" = "aarch64" ] || [ "$HOST_ARCH" = "arm64" ]; then
            log "宿主机是 $HOST_ARCH：容器原生运行，跳过 qemu binfmt 注册。"
          else
            log "注册 qemu-aarch64 binfmt（让 docker 能运行 arm64 容器）..."
            set +e
            docker run --privileged --rm tonistiigi/binfmt:latest --install aarch64 2>&1 | tail -5
            RC1=$?
            docker run --privileged --rm multiarch/qemu-user-static --reset -p yes 2>&1 | tail -5
            RC2=$?
            set -e
            if [ "${RC1:-1}" -ne 0 ] && [ "${RC2:-1}" -ne 0 ]; then
              err "binfmt 注册失败（两个镜像都拉不到）。arm64 容器将依赖宿主原生能力；若宿主非 arm64，后续 docker run 会失败。"
            else
              log "binfmt 注册完成。"
            fi
          fi

          log "在 arm64 容器内安装 Node20 + Chromium..."

          # 把容器内脚本写成【独立文件】，再用 docker run -v 挂载执行，
          # 彻底绕开 bash -c '...' 的引号地狱；文件内 set -ex 的跟踪会直接出现在日志里，
          # 下次再炸能一眼看到容器内哪一行出错（之前 100/127 都因 bash -c 吞掉了内部 trace）。
          # 注意：外层用 <<'INNER_EOF'（单引号）包裹，故内层单/双引号、$(...) 都不会被外层展开。
          cat > /tmp/rootfs_inner.sh <<'INNER_EOF'
          #!/bin/bash
          set -ex
          export DEBIAN_FRONTEND=noninteractive

          # 禁止 postinst 启动任何系统服务（systemd/dbus 等），避免
          # "System has not been booted with systemd" 类非致命报错中止 apt 安装。
          printf "#!/bin/sh\nexit 101\n" > /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d

          S="bookworm"
          printf 'deb http://deb.debian.org/debian %s main contrib non-free\ndeb http://deb.debian.org/debian %s-updates main contrib non-free\ndeb http://deb.debian.org/debian-security %s-security main\n' "$S" "$S" "$S" > /etc/apt/sources.list
          echo openminis > /etc/hostname
          printf "nameserver 8.8.8.8\nnameserver 1.1.1.1\n" > /etc/resolv.conf

          echo "[PHASE] apt update"
          apt-get update -qq || apt-get update -qq || true

          echo "[PHASE] 基础工具"
          # 注意：必须装 busybox-static（静态链接二进制，不依赖动态加载器）。
          # 去 usrmerge 时会先删掉 /lib64 符号链接，导致动态加载器短暂失效，
          # 此刻普通 mkdir/cp 都跑不起来；只有静态 busybox 能在断链状态下执行删/建/拷。
          apt-get install -y -qq --no-install-recommends ca-certificates curl wget gnupg lsb-release xz-utils git python3 make g++ pkg-config bash busybox busybox-static coreutils util-linux procps

          echo "[PHASE] Node.js (nodesource 20，失败回退 Debian 自带)"
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash - || echo "[WARN] nodesource 不可用，回退 Debian 自带 nodejs"
          apt-get install -y -qq --no-install-recommends nodejs npm || true
          node --version || true
          npm --version || true

          echo "[PHASE] Chromium（只装 chromium，让 apt 自动解析依赖；不手列库名，避免某个库名解析失败返回 100）"
          # 首次失败 -> 修复依赖并重试；仍失败则打印明确 [FATAL] 后退出 1，
          # 不再返回难以定位的 100。
          if ! apt-get install -y -qq --no-install-recommends chromium fonts-liberation; then
            echo "[WARN] chromium 首次安装失败，尝试修复依赖后重试..."
            dpkg --configure -a || true
            apt-get install -y -qq --fix-broken || true
            apt-get install -y -qq --no-install-recommends chromium fonts-liberation \
              || { echo "[FATAL] chromium 安装最终失败，详见上方 apt 错误"; exit 1; }
          fi
          echo "[PHASE] Chromium 安装完成"
          chromium --version || true

          echo "[PHASE] 清理 apt 缓存"
          rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* 2>/dev/null || true

          echo "[PHASE] 去 usrmerge（关键修复）"
          # Debian 12 里 /bin /sbin /lib /lib64 是指向 usr/* 的符号链接。
          # OpenMinis 的 extractTar() 在 Android 上创建符号链接失败会静默跳过，
          # 导致 /bin、/lib、/lib64 直接缺失 -> proot 跑 /bin/sh 时找不到加载器 ->
          # 持久 shell 进程秒退 -> [Shell not running]。
          # 这里把它们换成真实目录+真实文件，确保解压后 /bin/sh 与加载器一定存在。
          #
          # 死锁警告：所有动态二进制（mkdir/cp/sh…）的加载器路径是
          # /lib64/ld-linux-aarch64.so.1；/lib64 当前是符号链接。一旦 rm 掉 /lib64，
          # 加载器路径即断裂，后续 mkdir/cp 自己都跑不起来（cannot execute:
          # required file not found，这正是上一次 exit 127 的真因）。
          # 因此必须用【静态链接】的 busybox-static 执行删/建/拷，它在加载器缺失时
          # 仍能运行；先把 /lib64 的加载器恢复，动态命令才恢复可用。
          BB=/usr/bin/busybox
          [ -x "$BB" ] || BB=/bin/busybox

          # 1) 先把 /lib64 换成真实目录并放入加载器（用静态 busybox，断链也能跑）
          if [ -L /lib64 ]; then
            $BB rm -f /lib64
            $BB mkdir -p /lib64
          fi
          $BB cp -aL /usr/lib64/ld-linux-aarch64.so.1 /lib64/ 2>/dev/null \
            || $BB cp -aL /usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1 /lib64/
          # 此刻 /lib64/ld-linux-aarch64.so.1 已是真实文件，动态加载器恢复可用

          # 2) /lib 换成真实目录（删除不影响加载器，可放心用静态 busybox）
          if [ -L /lib ]; then
            $BB rm -f /lib
            $BB mkdir -p /lib /lib/aarch64-linux-gnu
          fi
          $BB cp -aL /usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1 /lib/ 2>/dev/null || true
          $BB cp -aL /usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1 /lib/aarch64-linux-gnu/ 2>/dev/null || true
          # 核心 glibc 运行库做成真实文件（dash 及多数程序启动所必需）
          for _l in libc.so.6 libdl.so.2 libm.so.6 libpthread.so.0 librt.so.1 libgcc_s.so.1 libresolv.so.2; do
            $BB cp -aL /usr/lib/aarch64-linux-gnu/$_l /lib/aarch64-linux-gnu/ 2>/dev/null || true
          done

          # 3) /bin 换成真实目录并放入 sh
          if [ -L /bin ]; then
            $BB rm -f /bin
            $BB mkdir -p /bin
          fi
          $BB cp -aL /usr/bin/sh /bin/sh 2>/dev/null || true

          echo "[PHASE] 去 usrmerge 校验:"; ls -l /bin/sh /lib64/ld-linux-aarch64.so.1 /lib/aarch64-linux-gnu/libc.so.6 2>&1
          INNER_EOF

          docker rm -f remotion-rootfs >/dev/null 2>&1 || true
          docker run --name remotion-rootfs --platform linux/arm64 \
            -v /tmp/rootfs_inner.sh:/rootfs_inner.sh \
            "$DOCKER_IMG" bash /rootfs_inner.sh
          log "导出容器文件系统为 rootfs tarball (docker export，避免容器内 tar 打活 FS 的致命错误)..."
          # 选压缩器：优先 pigz（并行、更快），否则 gzip；若宿主机俩都没装，现场 apt 装 gzip。
          # 这正是之前 exit 127 的根因——arm64 runner 上 gzip 没预装，docker export | gzip
          # 报 "gzip: command not found" -> 管道退出 127 -> 整个 step 失败。这里做兜底，
          # 保证无论宿主机有没有压缩器都不会再 127。
          COMP=""
          command -v pigz >/dev/null 2>&1 && COMP=pigz
          [ -z "$COMP" ] && command -v gzip >/dev/null 2>&1 && COMP=gzip
          if [ -z "$COMP" ]; then
            log "宿主机缺压缩器，现场安装 gzip..."
            sudo apt-get update -qq && sudo apt-get install -y -qq gzip
            COMP=gzip
          fi
          log "导出 rootfs（压缩器=$COMP）..."
          if [ "$COMP" = pigz ]; then
            docker export remotion-rootfs | pigz -c -p "$(nproc)" > "$OUT_DIR/debian-minirootfs.tar.gz"
          else
            docker export remotion-rootfs | gzip -c > "$OUT_DIR/debian-minirootfs.tar.gz"
          fi
          docker rm -f remotion-rootfs >/dev/null 2>&1 || true
          log "rootfs 已生成: $OUT_DIR/$OUT_TARBALL ($(du -h "$OUT_DIR/$OUT_TARBALL" | cut -f1))"
          PREP_EOF
          chmod +x /tmp/prepare_debian_rootfs_android.sh
          sudo /tmp/prepare_debian_rootfs_android.sh bookworm
          mkdir -p src/android/app/src/main/assets
          cp debian-minirootfs.tar.gz src/android/app/src/main/assets/

      - name: 使用系统自带 JDK 17（兼容 arm64 / x64 runner）
        run: |
          # 原生 arm64 runner (ubuntu-24.04-arm) 的 JDK 环境变量是 JAVA_HOME_17_ARM64，
          # 而 x64 runner 是 JAVA_HOME_17_X64。两者都兜底，避免 JAVA_HOME 指向不存在的路径
          # 导致后续 gradle 找不到 java 直接失败。
          if [ -n "${JAVA_HOME_17_ARM64:-}" ]; then JH="$JAVA_HOME_17_ARM64"
          elif [ -n "${JAVA_HOME_17_X64:-}" ]; then JH="$JAVA_HOME_17_X64"
          else JH="$JAVA_HOME"; fi
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          export JAVA_HOME="$JH"
          java -version

      - name: 安装 Android SDK/NDK (手动)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;28.0.12433566" "build-tools;34.0.0" "platforms;android-34" "cmake;3.22.1" || \
          sdkmanager --install "ndk;28.0.13004108" "build-tools;34.0.0" "platforms;android-34" "cmake;3.22.1"
          yes | sdkmanager --licenses
          NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: 编译 proot 二进制 (build_proot.sh)
        run: ./deps/build_proot.sh

      # ===== 打 Kotlin 补丁（python 在运行时生成，不依赖外部文件）=====
      - name: 打 Kotlin 补丁
        run: |
          cat > /tmp/apply_patches.py <<'PY_EOF'
          #!/usr/bin/env python3
          import sys
          import os

          REPO = sys.argv[1] if len(sys.argv) > 1 else "."
          SANDBOX = os.path.join(
              REPO, "src/android/app/src/main/java/com/openminis/app/sandbox")

          ROOTFS = os.path.join(SANDBOX, "RootfsManager.kt")
          PROOT = os.path.join(SANDBOX, "PRootKernel.kt")


          def replace_once(path, old, new, label):
              if not os.path.isfile(path):
                  print(f"  [SKIP] {path} not found")
                  return False
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()
              if old not in text:
                  print(f"  [FAIL] pattern not found in {os.path.basename(path)}:\n"
                        f"         {label}\n         -> aborting (file may have changed).")
                  sys.exit(1)
              if text.count(old) != 1:
                  print(f"  [WARN] pattern matched {text.count(old)} times in "
                        f"{os.path.basename(path)}; applying to first only.")
              text = text.replace(old, new, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print(f"  [OK]   patched {os.path.basename(path)} - {label}")
              return True


          print("== OpenMinis: Alpine->Debian (glibc) patch for Remotion ==\n")

          print("[1/2] RootfsManager.kt")
          replace_once(
              ROOTFS,
              'val rootfsDir: File = File(context.filesDir, "alpine-rootfs")',
              'val rootfsDir: File = File(context.filesDir, "debian-rootfs")',
              'rootfsDir path: alpine-rootfs -> debian-rootfs')

          replace_once(
              ROOTFS,
              'private const val ROOTFS_ASSET = "alpine-minirootfs.tar.gz"',
              'private const val ROOTFS_ASSET = "debian-minirootfs.tar.gz"',
              'ROOTFS_ASSET: debian-minirootfs.tar.gz')

          replace_once(
              ROOTFS,
              'private const val ROOTFS_ASSET_TAR = "alpine-minirootfs.tar"',
              'private const val ROOTFS_ASSET_TAR = "debian-minirootfs.tar"',
              'ROOTFS_ASSET_TAR: debian-minirootfs.tar')

          replace_once(
              ROOTFS,
              'Log.i(TAG, "Installing Alpine rootfs...")',
              'Log.i(TAG, "Installing Debian rootfs...")',
              'log string: Alpine -> Debian')

          print("\n[2/2] PRootKernel.kt")
          # 重要：这里【不要】给 proot 加 `-b /dev/shm`！
          # Android 宿主根本没有 /dev/shm（那是 glibc 桌面 Linux 的东西），
          # 一旦在 proot 命令里写 `-b /dev/shm`，proot 启动时因绑定路径不存在
          # 直接报错退出，会连带【所有】 shell 执行一起挂掉。
          # 共享内存改由 default_mount 的 profile.d 在 guest 内部用 tmpfs 挂载，
          # 不依赖宿主路径。因此这里保持 PRootKernel 原版绑定不变。
          print("  [SKIP] 保持 PRootKernel 原版绑定 (-b /dev /proc /sys)；")
          print("         不加 -b /dev/shm（Android 宿主无此路径，会导致 proot 启动失败）")

          print("\n[3/3] build.gradle.kts (noCompress 修复)")
          # AGP 的 CompressAssetsWorkAction 按“最后一个点之后的扩展名”去查
          # noCompress 集合；文件 debian-minirootfs.tar.gz 的末段是 "gz"，
          # 而原集合只写了 "tar.gz"，导致它仍对该近 GB 资产做 zstd 全量压缩、
          # 撑爆 JVM 堆 (Java heap space)。把 "gz" 也加进去即可让其跳过压缩。
          BUILD_GRADLE = os.path.join(REPO, "src/android/app/build.gradle.kts")
          replace_once(
              BUILD_GRADLE,
              'noCompress += listOf("tar.gz", "proot-aarch64")',
              'noCompress += listOf("tar.gz", "gz", "proot-aarch64")',
              'noCompress: 加入 "gz" 防止 CompressAssetsWorkAction 全量压缩 rootfs')

          print("\n== Done. ==")
          PY_EOF
          python3 /tmp/apply_patches.py .

      - name: 写入 Debian 版 default_mount（内联）
        run: |
          DM=src/android/app/src/main/assets/default_mount
          rm -rf "$DM"
          mkdir -p "$DM/etc/apt" "$DM/etc/profile.d"
          cat > "$DM/etc/apt/sources.list" <<'EOF'
          deb http://deb.debian.org/debian bookworm main contrib non-free
          deb http://deb.debian.org/debian-security bookworm-security main
          EOF
          cat > "$DM/etc/resolv.conf" <<'EOF'
          nameserver 8.8.8.8
          nameserver 1.1.1.1
          EOF
          cat > "$DM/etc/profile.d/minis.sh" <<'EOF'
          export PATH="/usr/local/bin:/opt/bin:$PATH"
          export CHROME_HEADLESS=1

          # Chromium / Remotion 需要 /dev/shm 作为共享内存。Android 宿主没有
          # /dev/shm，所以不能在 proot 里用 `-b /dev/shm` 绑定（会令 proot 启动
          # 失败、拖垮所有 shell）。此处改为在 sandbox 内部挂载一个 tmpfs 到
          # /dev/shm。若 proot 禁止挂载则静默跳过——此时请在 Remotion 项目里给
          # Chromium 加 --disable-dev-shm-usage 兜底。
          if [ ! -e /dev/shm ]; then
            mkdir -p /dev/shm 2>/dev/null
          fi
          if ! mountpoint -q /dev/shm 2>/dev/null; then
            mount -t tmpfs -o size=256M,mode=1777 tmpfs /dev/shm 2>/dev/null || true
          fi
          EOF

      - name: 编译 debug APK
        working-directory: src/android
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          # stageDebugSkillAssets 任务要求 .claude/skills/debug-server 目录存在
          # （该目录未提交进 git，原始仓库 CI 会自行创建；gen 脚本对空目录可容忍）
          mkdir -p "$GITHUB_WORKSPACE/.claude/skills/debug-server"
          # 强制覆盖 Gradle/AGP 堆内存：OpenMinis 自带的 gradle.properties 里已写
          # org.gradle.jvmargs=-Xmx2048m，compressDebugAssets 用此小堆处理近 GB 的
          # rootfs 资产会 Java heap space 失败。先删掉原有行，再写入 -Xmx4g。
          GRADLE_PROP=gradle.properties
          if [ -f "$GRADLE_PROP" ]; then
            grep -v "^org.gradle.jvmargs=" "$GRADLE_PROP" > "$GRADLE_PROP.tmp" || true
            mv "$GRADLE_PROP.tmp" "$GRADLE_PROP"
          fi
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> "$GRADLE_PROP"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
